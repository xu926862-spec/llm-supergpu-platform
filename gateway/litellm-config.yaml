litellm_settings:
  drop_params: true
  request_timeout: 600
  num_retries: 3
  fallbacks:
    - auto: [qwen-plus, qwen3-32b, qwen2.5-72b-instruct, qwen-turbo]
    - supergpu-flagship: [qwen3-235b-a22b, qwen-max, qwen3-32b]
    - supergpu-fast: [qwen-plus, qwen-turbo, qwen3-8b]
    - supergpu-smart: [qwen3-32b, qwen3-14b, deepseek-reasoner]
    - supergpu-coder: [qwen2.5-coder-32b-instruct, qwen2.5-coder-14b-instruct]

general_settings:
  master_key: "${LITELLM_MASTER_KEY:-sk-supergpu}"

router_settings:
  routing_strategy: least-busy
  allowed_fails: 2
  cooldown_time: 30
  retry_after: 5
