    litellm_params:
      model: openai/qwen2.5-7b-instruct
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: "${BAILIAN_API_KEY}"

  # --- Bailian Coder ---
  - model_name: qwen2.5-coder-32b-instruct
    litellm_params:
