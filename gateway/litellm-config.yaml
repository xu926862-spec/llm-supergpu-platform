  - model_name: qwen2.5-coder-7b-instruct
    litellm_params:
      model: openai/qwen2.5-coder-7b-instruct
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: "${BAILIAN_API_KEY}"

  # --- Bailian Math / Long ---
  - model_name: qwen2.5-math-72b-instruct
    litellm_params:
      model: openai/qwen2.5-math-72b-instruct
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: "${BAILIAN_API_KEY}"

  - model_name: qwen-long
    litellm_params:
      model: openai/qwen-long
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: "${BAILIAN_API_KEY}"

  # --- DeepSeek ---
  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: "${DEEPSEEK_API_KEY}"

  - model_name: deepseek-reasoner
    litellm_params:
      model: deepseek/deepseek-reasoner
      api_key: "${DEEPSEEK_API_KEY}"

  # --- Claude ---
  - model_name: claude-sonnet
    litellm_params:
      model: claude-sonnet-4-6
      api_key: "${ANTHROPIC_API_KEY}"

  # --- Local vLLM (optional, enable when GPU is rented) ---
  - model_name: local-72b
    litellm_params:
      model: openai/qwen2.5-72b
      api_base: "${VLLM_API_BASE:-http://localhost:8000/v1}"
      api_key: "none"

  # --- Auto group (load balance + failover) ---
  - model_name: auto
    litellm_params:
      model: openai/qwen-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: "${BAILIAN_API_KEY}"
      weight: 3

  - model_name: auto
    litellm_params:
      model: openai/qwen3-32b
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: "${BAILIAN_API_KEY}"
      weight: 2

  - model_name: auto
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: "${DEEPSEEK_API_KEY}"
      weight: 1

litellm_settings:
  drop_params: true
  request_timeout: 600
  num_retries: 3
  fallbacks:
    - auto: [qwen-plus, qwen3-32b, deepseek-chat, qwen-turbo]
    - supergpu-flagship: [qwen3-235b-a22b, qwen-max, qwen3-32b]
    - supergpu-fast: [qwen-plus, qwen-turbo, qwen3-8b]
    - supergpu-smart: [qwen3-32b, qwen3-14b, deepseek-reasoner]
    - supergpu-coder: [qwen2.5-coder-32b-instruct, qwen2.5-coder-7b-instruct]

general_settings:
  master_key: "${LITELLM_MASTER_KEY:-sk-supergpu}"
  database_url: "${DATABASE_URL:-}"

router_settings:
  routing_strategy: least-busy
  allowed_fails: 2
  cooldown_time: 30
  retry_after: 5
