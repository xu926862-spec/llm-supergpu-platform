    - supergpu-flagship: [qwen3-235b-a22b, qwen-max, qwen3-32b]
    - supergpu-fast: [qwen-plus, qwen-turbo, qwen3-8b]
    - supergpu-smart: [qwen3-32b, qwen3-14b, deepseek-reasoner]
    - supergpu-coder: [qwen2.5-coder-32b-instruct, qwen2.5-coder-14b-instruct]

